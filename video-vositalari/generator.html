// Erkin qurish rejasi: 12×9 m uy, 3 xona. 0–3 s — qo'lda (titroq, uchlari chiqib turgan chiziqlar), 3–4 s — to'g'rilanadi, so'ng o'lcham va maydonlar

function planSketch(cx, cy, cw, ch, s) {
  const pad = 110, sc = Math.min((cw - pad * 2) / PLAN.W, (ch - pad * 2) / PLAN.D), ox = cx + (cw - PLAN.W * sc) / 2, oy = cy + (ch - PLAN.D * sc) / 2 - 10;
  const P = (mx, my) => [ox + mx * sc, oy + my * sc];
  const draw = Math.min(1, s / 2.8), morph = ease((s - 3.0) / 0.9), lens = PLAN.segs.map(([a, b, c, d]) => Math.hypot(c - a, d - b)), total = lens.reduce((q, v) => q + v, 0);
  let acc = 0; const col = `rgb(${Math.round(lerp(34, 29, morph))},${Math.round(lerp(34, 58, morph))},${Math.round(lerp(34, 138, morph))})`;

      const [px2, py2] = P(a + ux * along + nx * wob, b + uy * along + ny * wob);
      j ? x.lineTo(px2, py2) : x.moveTo(px2, py2);
    }
    x.stroke();

    x.save(); x.translate(l0 - 48, (t0 + b0) / 2); x.rotate(-Math.PI / 2); x.fillText("9,00", 0, 0); x.restore();
    PLAN.rooms.forEach(([nm0, mx, my, ar], j) => { const nm = L("rooms")[j] || nm0; const ra = ease((s - 4.2 - j * .15) / .4); if (ra <= 0) return; x.save(); x.globalAlpha *= ra; const [qx, qy] = P(mx, my); x.font = `600 28px ${B}`; x.fillStyle = "#222"; x.fillText(nm, qx, qy); x.font = `600 26px ${M}`; x.fillStyle = "#1d3a8a"; x.fillText(`${ar} m²`, qx, qy + 36); x.restore(); });
  }

}

function sketchify(img) {
  const w = Math.round(img.width), h = Math.round(img.height), c0 = document.createElement("canvas"); c0.width = w; c0.height = h;
  const g0 = c0.getContext("2d"); g0.fillStyle = "#fff"; g0.fillRect(0, 0, w, h); g0.drawImage(img, 0, 0, w, h);
  const src = g0.getImageData(0, 0, w, h).data, L = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) L[i] = 0.3 * src[i * 4] + 0.59 * src[i * 4 + 1] + 0.11 * src[i * 4 + 2];
  const out = g0.createImageData(w, h), o = out.data;
  let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  for (let y = 1; y < h - 1; y++) for (let xx = 1; xx < w - 1; xx++) {
    const i = y * w + xx, gx = -L[i - w - 1] - 2 * L[i - 1] - L[i + w - 1] + L[i - w + 1] + 2 * L[i + 1] + L[i + w + 1], gy = -L[i - w - 1] - 2 * L[i - w] - L[i - w + 1] + L[i + w - 1] + 2 * L[i + w] + L[i + w + 1];
    const m = Math.min(1, Math.hypot(gx, gy) / 220), shade = (255 - L[i]) / 255 * 0.12;                      // qirra + juda yengil tus (shtrix o'rnida)
    const a = Math.min(1, Math.pow(m, 0.8) * (0.75 + 0.25 * rnd()) + shade * (rnd() < 0.5 ? 1 : 0));
    o[i * 4] = 26; o[i * 4 + 1] = 26; o[i * 4 + 2] = 28; o[i * 4 + 3] = Math.round(a * 255);
  }

}

function mixVoice(buf) {

}
