function sketchify(img) {
  const w = Math.round(img.width), h = Math.round(img.height), c0 = document.createElement("canvas"); c0.width = w; c0.height = h;
  const g0 = c0.getContext("2d"); g0.fillStyle = "#fff"; g0.fillRect(0, 0, w, h); g0.drawImage(img, 0, 0, w, h);
  const src = g0.getImageData(0, 0, w, h).data, L = new Float32Array(w * h);

  const out = g0.createImageData(w, h), o = out.data;

  for (let y = 1; y < h - 1; y++) for (let xx = 1; xx < w - 1; xx++) {

function mixVoice(buf) {

// QP (past = tiniqroq, fayl kattaroq): villa dron kadrlari 26 (yengil keskinlik bilan), qolgan sahnalar 30 — fayl < 20 MB (artifact chegarasi)
let QP_VILLA = 26, QP_REST = 30;   // yangi 13 til: 29 va 32 (17 video artifactning 256 MB chegarasiga sig'sin)

async function encode() {
  log("musiqa yaratilmoqda…"); const music = await encodeAudio(await makeMusic());
  const cands = ["avc1.640028", "avc1.4d0028", "avc1.420028"]; let cfg = null;
  for (const codec of cands) { const t = { codec, width: W, height: H, bitrate: 1_600_000, framerate: FPS, bitrateMode: "quantizer", avc: { format: "avc" }, latencyMode: "quality" };   /* kadr sifati QP bilan beriladi */ const r = await VideoEncoder.isConfigSupported(t).catch(() => null); if (r && r.supported) { cfg = t; break; } }

    audio: { sr: SR, ch: 2, sizes: music.chunks.map(b => b.length), asc: Array.from(music.asc) } }));
